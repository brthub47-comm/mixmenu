<!doctype html>
<html lang="fr" data-skin="onepiece">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E120B">
<title>Mix'Menu - Édition Piraterie !</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ THÈMES ============ */
html[data-skin="cuisine"]{--bg:#FFF6EA;--surface:#FFFFFF;--surface-2:#FFF0DD;--ink:#2A2238;--muted:#7A6F86;--line:#F1DFC6;--accent:#5B4BDB;--accent-dark:#3F31B0;--accent-ink:#fff;--p:#FF6B4A;--l:#22A861;--f:#E09A00;--joker:#E2449A;--joker-2:#8B5CF6;--shadow:0 8px 0 #E2C9AB}
html[data-skin="onepiece"]{--bg:#1E120B;--surface:#322015;--surface-2:#442E1F;--ink:#FDF3E7;--muted:#CDB39A;--line:#5C3E28;--accent:#D9381E;--accent-dark:#9E200C;--accent-ink:#FFF;--p:#E65100;--l:#2E7D32;--f:#F57F17;--joker:#D81B60;--joker-2:#8E24AA;--shadow:0 8px 0 #120905}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;min-height:100vh;padding-bottom:20px}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex:1}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface-2);border:2px solid var(--line)}
.brand h1{margin:0;font-size:1.3rem}
.brand p{margin:0;font-size:.8rem;color:var(--muted)}
.scores{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);font-size:.9rem}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-size:20px;display:grid;place-items:center}

/* LAYOUT */
.layout{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:20px}
@media(min-width:800px){.layout{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:28px;padding:20px;border:3px solid var(--line);box-shadow:var(--shadow)}

/* TURNS & BELTS */
.turn{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.big-av{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:var(--surface-2);border:2px solid var(--line)}
.belts{display:grid;gap:12px}
.belt-label{font-size:.85rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:'Fredoka'}
.belt-window{position:relative;height:90px;border-radius:18px;overflow:hidden;background:var(--surface-2);border:2px solid var(--line)}
.track{position:absolute;top:6px;left:0;display:flex;gap:10px;transition:transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)}
.tile{flex:none;width:76px;height:76px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line)}
.tile .em{font-size:28px}
.tile .nm{font-size:.65rem;text-align:center;padding:0 2px}
.frame{position:absolute;top:2px;bottom:2px;left:50%;width:84px;margin-left:-42px;border-radius:16px;border:3px solid var(--accent);pointer-events:none}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:16px;border:2px solid var(--line);font-family:'Fredoka';font-size:1rem;background:var(--surface-2);width:100%;margin-top:10px}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}

/* SEMAINE */
.days{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.day{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:8px;border-radius:18px;background:var(--surface-2);border:2px solid transparent}
.day.target{border-color:var(--accent)}
.day-head{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border-radius:12px;border:2px solid var(--line)}
.meal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:.85rem}
.empty-btn{width:100%;padding:10px;border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}
.joker-btn{width:100%;padding:8px 12px;border-radius:12px;background:var(--joker);color:#fff;border:none;font-weight:bold;display:flex;align-items:center;gap:8px}

/* OVERLAYS */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.hidden{display:none!important}
.sheet{background:var(--surface);border-radius:24px;border:3px solid var(--line);padding:20px;width:100%;max-width:500px;max-height:85vh;overflow:auto}
.joker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.joker-opt{padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);text-align:center;cursor:pointer}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" id="logo">🍖</div>
    <div><h1>Mix'Menu</h1><p>Édition Piraterie</p></div>
  </div>
  <div class="scores" id="scores"></div>
  <button class="icon-btn" id="parentBtn" aria-label="Réglages">⚙️</button>
</header>

<main class="layout">
  <section class="card">
    <div class="turn" id="turn"></div>
    <div class="belts" id="beltsContainer"></div>
    <button class="btn btn-accent" id="mixBtn">🌀 Lancer le Mixeur !</button>
    <button class="btn hidden" id="serveBtn" style="background:var(--l);color:#fff">✓ Servir ce plat</button>
  </section>

  <section class="card">
    <h2>Le Menu de la Semaine</h2>
    <ol class="days" id="days"></ol>
  </section>
</main>

<!-- MODALE JOKER -->
<div class="overlay hidden" id="jokerOv">
  <div class="sheet">
    <h3>🃏 Choisir un Festin Joker</h3>
    <p style="color:var(--muted)">Un repas de fête pour toute la marmaille !</p>
    <div class="joker-grid" id="jokerList"></div>
    <button class="btn" id="closeJoker" style="margin-top:16px">Annuler</button>
  </div>
</div>

<!-- MODALE PARENTS -->
<div class="overlay hidden" id="parentOv">
  <div class="sheet">
    <h3>⚙️ Espace Parents</h3>
    <div id="pinBox">
      <p>Entrez le code secret (par défaut : 0000) :</p>
      <input type="password" id="pinInput" style="width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);margin-bottom:12px" placeholder="0000">
      <button class="btn btn-accent" id="pinBtn">Valider</button>
    </div>
    <div id="parentContent" class="hidden">
      <h4>Changer de Thème Visuel</h4>
      <select id="skinSelect" style="width:100%;padding:10px;border-radius:12px;margin-bottom:16px;background:var(--surface);color:var(--ink);border:2px solid var(--line)">
        <option value="onepiece">🏴‍☠️ One Piece (Pirates)</option>
        <option value="cuisine">🥣 Cuisine Classique</option>
      </select>
    </div>
    <button class="btn" id="closeParent" style="margin-top:16px">Fermer</button>
  </div>
</div>

<script>
(() => {
'use strict';

const FOODS = [
  {id:'p1', cat:'proteine', nom:'Viande de Sanji', emoji:'🍖'},
  {id:'p2', cat:'proteine', nom:'Poulet Rôti', emoji:'🍗'},
  {id:'p3', cat:'proteine', nom:'Poisson Pané', emoji:'🐟'},
  {id:'p4', cat:'proteine', nom:'Steak Haché', emoji:'🥩'},
  {id:'p5', cat:'proteine', nom:'Omelette', emoji:'🍳'},
  {id:'l1', cat:'legume', nom:'Agrumes de Nami', emoji:'🍊'},
  {id:'l2', cat:'legume', nom:'Haricots Verts', emoji:'🫛'},
  {id:'l3', cat:'legume', nom:'Carottes', emoji:'🥕'},
  {id:'l4', cat:'legume', nom:'Brocolis', emoji:'🥦'},
  {id:'l5', cat:'legume', nom:'Salade', emoji:'🥗'},
  {id:'f1', cat:'feculent', nom:'Onigiri Chapeau de Paille', emoji:'🍙'},
  {id:'f2', cat:'feculent', nom:'Pâtes', emoji:'🍝'},
  {id:'f3', cat:'feculent', nom:'Riz', emoji:'🍚'},
  {id:'f4', cat:'feculent', nom:'Frites', emoji:'🍟'},
  {id:'f5', cat:'feculent', nom:'Purée', emoji:'🥔'}
];

const JOKERS = [
  {id:'j1', nom:'Banquet de Pizza', emoji:'🍕'},
  {id:'j2', nom:'Burger des Mers', emoji:'🍔'},
  {id:'j3', nom:'Ramen de Naruto', emoji:'🍜'},
  {id:'j4', nom:'Feast de Viande', emoji:'🍖'}
];

const KIDS = [
  {name:'Luffy', avatar:'👒', color:'#D9381E', stars:120},
  {name:'Zoro', avatar:'⚔️️', color:'#2E7D32', stars:95}
];

const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
let menu = Array(7).fill(null);
let pendingMeal = null;
let activeJokerDay = null;

const $ = s => document.querySelector(s);

function getTargetDay() {
  return menu.findIndex(m => m === null);
}

function render() {
  // Scores
  $('#scores').innerHTML = KIDS.map(k => 
    `<div class="pill"><span>${k.avatar}</span><b>${k.name}</b> <span>${k.stars}⭐</span></div>`
  ).join('');

  // Tour
  const target = getTargetDay();
  const turn = $('#turn');
  if (pendingMeal) {
    turn.innerHTML = `<div class="big-av">🍽️</div><div><h3>Plat prêt !</h3><p>Valide pour ajouter au menu.</p></div>`;
    $('#mixBtn').classList.add('hidden');
    $('#serveBtn').classList.remove('hidden');
  } else if (target !== -1) {
    const kid = KIDS[target % KIDS.length];
    turn.innerHTML = `<div class="big-av" style="border-color:${kid.color}">${kid.avatar}</div><div><h3>Au tour de ${kid.name}</h3><p>Jour : ${DAYS[target]}</p></div>`;
    $('#mixBtn').classList.remove('hidden');
    $('#serveBtn').classList.add('hidden');
  } else {
    turn.innerHTML = `<div class="big-av">🎉</div><div><h3>Menu complet !</h3><p>Bon appétit à l'équipage !</p></div>`;
    $('#mixBtn').classList.add('hidden');
    $('#serveBtn').classList.add('hidden');
  }

  // Tapis Roulants
  const cats = [
    {id:'proteine', label:'Protéine 🍖'},
    {id:'legume', label:'Légume 🍊'},
    {id:'feculent', label:'Féculent 🍙'}
  ];

  $('#beltsContainer').innerHTML = cats.map(c => {
    const list = FOODS.filter(f => f.cat === c.id);
    const selected = pendingMeal ? list.find(f => f.id === pendingMeal[c.id]) : list[0];
    return `
      <div>
        <div class="belt-label">${c.label}</div>
        <div class="belt-window">
          <div class="track">
            <div class="tile">
              <span class="em">${selected.emoji}</span>
              <span class="nm">${selected.nom}</span>
            </div>
          </div>
          <div class="frame"></div>
        </div>
      </div>
    `;
  }).join('');

  // Jours
  $('#days').innerHTML = DAYS.map((d, i) => {
    const isTarget = i === target;
    const item = menu[i];
    let body = '';
    if (item) {
      if (item.type === 'joker') {
        body = `<div class="joker-btn"><span>${item.emoji}</span> <span>JOKER : ${item.nom}</span></div>`;
      } else {
        body = `
          <span class="chip">${item.p.emoji} ${item.p.nom}</span>
          <span class="chip">${item.l.emoji} ${item.l.nom}</span>
          <span class="chip">${item.f.emoji} ${item.f.nom}</span>
        `;
      }
    } else {
      body = `
        <button class="empty-btn" onclick="window.openJoker(${i})">＋ Choisir un repas ou un Joker 🃏</button>
      `;
    }

    return `
      <li class="day ${isTarget ? 'target' : ''}">
        <div class="day-head"><b>${d.slice(0,3)}</b></div>
        <div class="meal">${body}</div>
      </li>
    `;
  }).join('');
}

// Mixeur
$('#mixBtn').addEventListener('click', () => {
  const pick = cat => FOODS.filter(f => f.cat === cat)[Math.floor(Math.random() * FOODS.filter(f => f.cat === cat).length)];
  pendingMeal = {
    proteine: pick('proteine').id,
    legume: pick('legume').id,
    feculent: pick('feculent').id
  };
  render();
});

// Valider le repas
$('#serveBtn').addEventListener('click', () => {
  const target = getTargetDay();
  if (target !== -1 && pendingMeal) {
    menu[target] = {
      p: FOODS.find(f => f.id === pendingMeal.proteine),
      l: FOODS.find(f => f.id === pendingMeal.legume),
      f: FOODS.find(f => f.id === pendingMeal.feculent)
    };
    pendingMeal = null;
    render();
  }
});

// Jokers
window.openJoker = (dayIndex) => {
  activeJokerDay = dayIndex;
  $('#jokerList').innerHTML = JOKERS.map(j => `
    <div class="joker-opt" onclick="window.selectJoker('${j.id}')">
      <div style="font-size:32px">${j.emoji}</div>
      <b>${j.nom}</b>
    </div>
  `).join('');
  $('#jokerOv').classList.remove('hidden');
};

window.selectJoker = (id) => {
  const j = JOKERS.find(x => x.id === id);
  if (activeJokerDay !== null && j) {
    menu[activeJokerDay] = { type: 'joker', nom: j.nom, emoji: j.emoji };
    $('#jokerOv').classList.add('hidden');
    render();
  }
};

$('#closeJoker').addEventListener('click', () => $('#jokerOv').classList.add('hidden'));

// Espace Parents
function closeParentModal() {
  $('#parentOv').classList.add('hidden');
  $('#pinInput').value = '';
  $('#pinBox').classList.remove('hidden');
  $('#parentContent').classList.add('hidden');
}

$('#parentBtn').addEventListener('click', () => $('#parentOv').classList.remove('hidden'));
$('#closeParent').addEventListener('click', closeParentModal);

$('#pinBtn').addEventListener('click', () => {
  if ($('#pinInput').value === '0000') {
    $('#pinBox').classList.add('hidden');
    $('#parentContent').classList.remove('hidden');
  } else {
    alert('Code PIN incorrect (par défaut : 0000)');
  }
});

$('#skinSelect').addEventListener('change', (e) => {
  document.documentElement.dataset.skin = e.target.value;
});

render();
})();
</script>
</body>
</html>
